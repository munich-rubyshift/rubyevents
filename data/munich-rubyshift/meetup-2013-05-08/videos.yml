- id: "writing-hard-migrations-in-rails"
  title: "Writing hard migrations in Rails"
  date: "2013-05-08"
  language: "English"
  video_provider: "not_recorded"
  video_id: "writing-hard-migrations-in-rails"
  description: |-
    Rails migrations let you change your database schema with simple commands like `create_table` or `add_column`. Unfortunately these commands are not expressive enough to handle cases where existing data must be processed and moved around tables. This talk shows different techniques you can use to describe nontrivial migrations in Rails.
  speakers:
    - Henning Koch

- id: "lighting-fast-rails-with-zeus"
