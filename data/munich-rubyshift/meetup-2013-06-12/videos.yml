  description: |-
    What options does Ruby offer to serve client-side web applications? Using Backbone.js I will show the elements of a client-side web application (events, rendering, data transport), how Rack and Sinatra can be used to serve directories of JavaScript files. Lastly I show the relationship between Rack, Sprockets and the Asset Pipeline and RequireJS-Rails.
